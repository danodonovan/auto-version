[project]
name = "auto-version"
version = "0.2.0"
description = "Automatic release management for Python monorepos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "packaging>=21.0",
    "pygit2>=1.13.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
auto-version = "auto_version.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_version"]

[tool.auto_version]
# auto-version releases itself. tag_format matches the tags already on this
# repository (0.1.0, 0.2.0) — bare versions, since there is only one package.
tag_format = "{version}"
version_toml = ["pyproject.toml:project.version"]
path_filters = ["."]
commit_message = "release: auto-version {version} [skip ci]"
changelog_path = "CHANGELOG.md"
github_repo = "danodonovan/auto-version"
# No version_variables: __version__ reads the installed metadata, so there is
# no second copy of the version to keep in step.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src"]
